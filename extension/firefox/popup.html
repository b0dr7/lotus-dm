<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lotus Download Manager</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="icons/icon-32.png" alt="" width="20" height="20">
    <span class="name">Lotus</span>
    <span class="state" id="state">checking</span>
  </header>

  <p class="label">This tab</p>
  <p class="url" id="url">-</p>

  <div class="quality" id="qualityRow" hidden>
    <label for="quality">Quality</label>
    <select id="quality">
      <optgroup label="Video">
        <option value="2160p">2160p</option>
        <option value="1440p">1440p</option>
        <option value="1080p">1080p</option>
        <option value="720p" selected>720p</option>
        <option value="480p">480p</option>
        <option value="360p">360p</option>
        <option value="240p">240p</option>
      </optgroup>
      <optgroup label="Audio">
        <option value="mp3">mp3</option>
        <option value="aac">aac</option>
        <option value="opus">opus</option>
        <option value="flac">flac</option>
        <option value="wav">wav</option>
      </optgroup>
    </select>
  </div>

  <button id="send" class="primary" type="button" disabled>Add to queue</button>
  <p class="note" id="note"></p>

  <footer class="foot">
    <label for="port">Bridge port</label>
    <input id="port" type="number" min="1024" max="65535" step="1" inputmode="numeric">
    <button id="save" class="ghost" type="button">Save</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
