name: desktop

# Compile check for the Rust app. The real binaries are built by
# release-desktop.yml on tag pushes; this one just keeps main honest.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

# Pushing the refreshed Cargo.lock back to main needs a writable token.
permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Dependencies are added by editing Cargo.toml only (this project is
      # never built on the author's machine), so the lock file is refreshed
      # here. `cargo metadata` resolves and writes Cargo.lock without
      # compiling, and a push made with GITHUB_TOKEN starts no new run, so the
      # check in this same job is what verifies the refreshed lock.
      - name: Refresh Cargo.lock
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cargo metadata --format-version 1 > /dev/null
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already up to date"
            exit 0
          fi
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -q -m "chore(desktop): refresh Cargo.lock" -- Cargo.lock
          git push

      - name: Cargo check
        run: cargo check --locked --all-targets

      # `cargo check --all-targets` only compiles the #[cfg(test)] modules. This
      # runs them, so the torrent intake, FTP URL and MSE policy tests are
      # actual checks rather than dead code that happens to type-check.
      - name: Cargo test
        run: cargo test --locked
