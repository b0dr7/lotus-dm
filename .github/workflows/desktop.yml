name: desktop

# Compile check for the Rust app. The real binaries are built by
# release-desktop.yml on tag pushes; this one just keeps main honest.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

# Pushing the refreshed Cargo.lock back to main needs a writable token.
permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Dependencies are added by editing Cargo.toml only (this project is
      # never built on the author's machine), so the lock file has to be
      # refreshed here. `cargo metadata` resolves and writes Cargo.lock
      # without compiling; the check below then runs in the same job, which is
      # the only verification possible because a push made with GITHUB_TOKEN
      # does not start another workflow run.
      - name: Refresh Cargo.lock
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cargo metadata --format-version 1 > /dev/null
          if [ -n "$(git status --porcelain Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore(desktop): refresh Cargo.lock"
            git push
          fi

      - name: Cargo check
        run: cargo check --locked --all-targets
