name: release-desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Windows targets
        run: rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc

      - name: Build x64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build x86
        run: cargo build --release --target i686-pc-windows-msvc

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc /? | Select-Object -First 1

      - name: Build installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver = "${{ github.ref_name }}".TrimStart("v")
          Push-Location installer
          try {
            & $iscc "/DAppVer=$ver" "/DMyArch=x64"  "/DOutName=x64"       "lotus-dm.iss"
            if ($LASTEXITCODE -ne 0) { throw "x64 installer failed" }
            & $iscc "/DAppVer=$ver" "/DMyArch=x86"  "/DOutName=x86"       "lotus-dm.iss"
            if ($LASTEXITCODE -ne 0) { throw "x86 installer failed" }
            & $iscc "/DAppVer=$ver" "/DMyArch=both" "/DOutName=universal" "lotus-dm.iss"
            if ($LASTEXITCODE -ne 0) { throw "universal installer failed" }
          } finally {
            Pop-Location
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Verify icons
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing

          function IconPixels([string] $path) {
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $path).Path)
            if (-not $icon) { return 0 }
            $bmp = $icon.ToBitmap()
            $rect = New-Object System.Drawing.Rectangle(0, 0, $bmp.Width, $bmp.Height)
            $data = $bmp.LockBits(
              $rect,
              [System.Drawing.Imaging.ImageLockMode]::ReadOnly,
              [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $bytes = New-Object byte[] ($data.Stride * $bmp.Height)
            [System.Runtime.InteropServices.Marshal]::Copy($data.Scan0, $bytes, 0, $bytes.Length)
            $bmp.UnlockBits($data)
            $drawn = 0
            for ($i = 3; $i -lt $bytes.Length; $i += 4) {
              if ($bytes[$i] -ge 128) { $drawn++ }
            }
            $bmp.Dispose()
            return $drawn
          }

          $targets = @(
            "target\x86_64-pc-windows-msvc\release\lotus-dm.exe",
            "target\i686-pc-windows-msvc\release\lotus-dm.exe",
            "dist\LotusDM-windows-x64.exe",
            "dist\LotusDM-windows-x86.exe",
            "dist\LotusDM-windows-universal.exe"
          )
          foreach ($target in $targets) {
            if (-not (Test-Path $target)) { throw "$target is missing" }
            $pixels = IconPixels $target
            Write-Host ("{0}: {1} opaque icon pixels" -f $target, $pixels)
            if ($pixels -lt 100) { throw "$target has no icon" }
          }

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            desktop/dist/LotusDM-windows-x64.exe
            desktop/dist/LotusDM-windows-x86.exe
            desktop/dist/LotusDM-windows-universal.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
