name: android

# Compile check for the Android app on every push that touches it. The
# release workflow only runs on tags, and this project is built in CI only,
# so this is where Kotlin/Compose breakage shows up first.
on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Ignore the Gradle caches and rebuild from scratch"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # assembleDebug, not just compileDebugKotlin: the torrent engine ships
      # native libraries and a minSdk of its own, so packaging has to run too.
      - name: Assemble debug APKs
        run: |
          if [ "${{ inputs.fresh }}" = "true" ]; then
            gradle --no-daemon --stacktrace --no-build-cache --refresh-dependencies assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi
