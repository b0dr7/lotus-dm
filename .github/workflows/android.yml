name: android

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Ignore the Gradle caches and rebuild from scratch"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APKs (fresh caches)
        if: inputs.fresh
        run: gradle --no-daemon --stacktrace --no-build-cache --refresh-dependencies assembleDebug

      - name: Assemble debug APKs
        if: ${{ !inputs.fresh }}
        run: gradle --no-daemon --stacktrace assembleDebug
