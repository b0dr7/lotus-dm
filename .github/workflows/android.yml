name: android

# Compile check for the Android app on every push that touches it. The
# release workflow only runs on tags, and this project is built in CI only,
# so this is where Kotlin/Compose breakage shows up first.
on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # assembleDebug, not just compileDebugKotlin: the torrent engine ships
      # native libraries and a minSdk of its own, so packaging has to run too.
      - name: Assemble debug APKs
        run: gradle --no-daemon --stacktrace assembleDebug
