name: release-android

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APKs
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist
          shopt -s nullglob
          universal=""
          for f in app/build/outputs/apk/debug/*.apk; do
            base=$(basename "$f")
            case "$base" in
              *universal*) cp "$f" dist/LotusDM-android-universal.apk ;;
              *arm64-v8a*) cp "$f" dist/LotusDM-android-arm64-v8a.apk ;;
              *armeabi-v7a*) cp "$f" dist/LotusDM-android-armeabi-v7a.apk ;;
              *x86_64*) cp "$f" dist/LotusDM-android-x86_64.apk ;;
              app-debug.apk) universal="$f" ;;
            esac
          done
          if [ ! -f dist/LotusDM-android-universal.apk ] && [ -n "$universal" ]; then
            cp "$universal" dist/LotusDM-android-universal.apk
          fi
          echo "Collected:"; ls -la dist
          test -f dist/LotusDM-android-universal.apk
          test -f dist/LotusDM-android-arm64-v8a.apk
          test -f dist/LotusDM-android-armeabi-v7a.apk
          test -f dist/LotusDM-android-x86_64.apk

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            android/dist/LotusDM-android-universal.apk
            android/dist/LotusDM-android-arm64-v8a.apk
            android/dist/LotusDM-android-armeabi-v7a.apk
            android/dist/LotusDM-android-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
